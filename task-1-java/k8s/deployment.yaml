apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-1-java
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: task-1-java
  template:
    metadata:
      labels:
        app: task-1-java
    spec:
      containers:
        - name: task-1-java
          image: localhost:8083/task-1-java:17
          imagePullPolicy: IfNotPresent