name: Java CI and Publish to Nexus


on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-scan-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: pom.xml
          server-id: nexus
          server-username: NEXUS_USERNAME
          server-password: NEXUS_PASSWORD

      - name: Build and run unit tests
        run: mvn -B clean verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-test-reports
          path: target/surefire-reports/*.xml
          if-no-files-found: warn

      - name: Sonar analysis
        if: github.event_name != 'pull_request'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
          SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION }}
          SONAR_HOST_URL: https://sonarcloud.io
        run: |
          args=(
            "-Dsonar.projectKey=$SONAR_PROJECT_KEY"
            "-Dsonar.host.url=$SONAR_HOST_URL"
            "-Dsonar.organization="$SONAR_ORGANIZATION"
            "-Dsonar.token=$SONAR_TOKEN"
          )

          if [[ -n "$SONAR_ORGANIZATION" ]]; then
            args+=("-Dsonar.organization=$SONAR_ORGANIZATION")
          fi

          mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:5.1.0.4751:sonar "${args[@]}"

      - name: Upload JAR to Nexus Maven repository
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          NEXUS_MAVEN_URL: ${{ secrets.NEXUS_MAVEN_URL }}
        run: |
          mvn -B org.apache.maven.plugins:maven-deploy-plugin:3.1.3:deploy-file \
            -Dfile=target/task-1-java-1.0.0.jar \
            -DgroupId=com.example \
            -DartifactId=task-1-java \
            -Dversion=1.0.0 \
            -Dpackaging=jar \
            -DrepositoryId=nexus \
            -Durl="$NEXUS_MAVEN_URL"

      - name: Build and push Docker image to Nexus
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          NEXUS_REGISTRY: ${{ secrets.NEXUS_REGISTRY }}
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          echo "$NEXUS_PASSWORD" | docker login "$NEXUS_REGISTRY" \
            --username "$NEXUS_USERNAME" --password-stdin

          docker build -t "$NEXUS_REGISTRY/task-1-java:$GITHUB_SHA" .
          docker push "$NEXUS_REGISTRY/task-1-java:$GITHUB_SHA"

          docker tag "$NEXUS_REGISTRY/task-1-java:$GITHUB_SHA" \
            "$NEXUS_REGISTRY/task-1-java:latest"
          docker push "$NEXUS_REGISTRY/task-1-java:latest"

          docker logout "$NEXUS_REGISTRY"
