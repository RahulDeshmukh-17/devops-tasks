name: Java CI and Publish to Nexus

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-scan-publish:
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: pom.xml
          server-id: nexus
          server-username: NEXUS_USERNAME
          server-password: NEXUS_PASSWORD

      - name: Verify tools
        shell: powershell
        run: |
          java -version
          mvn -version
          docker --version

      - name: Build and run unit tests
        shell: powershell
        run: mvn -B clean verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-test-reports
          path: target/surefire-reports/*.xml
          if-no-files-found: warn

      - name: SonarCloud analysis
        if: github.event_name != 'pull_request'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
          SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION }}
        shell: powershell
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SONAR_TOKEN) -or
              [string]::IsNullOrWhiteSpace($env:SONAR_PROJECT_KEY) -or
              [string]::IsNullOrWhiteSpace($env:SONAR_ORGANIZATION)) {
            throw "Required SonarCloud secrets are missing."
          }

          mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:5.1.0.4751:sonar `
            "-Dsonar.projectKey=$env:SONAR_PROJECT_KEY" `
            "-Dsonar.organization=$env:SONAR_ORGANIZATION" `
            "-Dsonar.host.url=https://sonarcloud.io" `
            "-Dsonar.token=$env:SONAR_TOKEN"

          if ($LASTEXITCODE -ne 0) {
            throw "SonarCloud analysis failed."
          }

      - name: Upload JAR to Nexus Maven repository
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          NEXUS_MAVEN_URL: ${{ secrets.NEXUS_MAVEN_URL }}
        shell: powershell
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NEXUS_MAVEN_URL)) {
            throw "NEXUS_MAVEN_URL secret is missing."
          }

          if (-not (Test-Path "target/task-1-java-1.0.0.jar")) {
            throw "JAR file not found."
          }

          mvn -B org.apache.maven.plugins:maven-deploy-plugin:3.1.3:deploy-file `
            "-Dfile=target/task-1-java-1.0.0.jar" `
            "-DgroupId=com.example" `
            "-DartifactId=task-1-java" `
            "-Dversion=1.0.0" `
            "-Dpackaging=jar" `
            "-DrepositoryId=nexus" `
            "-Durl=$env:NEXUS_MAVEN_URL" `
            "-DgeneratePom=true"

          if ($LASTEXITCODE -ne 0) {
            throw "JAR upload to Nexus failed."
          }

      - name: Build and push Docker image to Nexus
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          NEXUS_REGISTRY: ${{ secrets.NEXUS_REGISTRY }}
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        shell: powershell
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NEXUS_REGISTRY) -or
              [string]::IsNullOrWhiteSpace($env:NEXUS_USERNAME) -or
              [string]::IsNullOrWhiteSpace($env:NEXUS_PASSWORD)) {
            throw "Required Nexus Docker secrets are missing."
          }

          if (-not (Test-Path "Dockerfile")) {
            throw "Dockerfile not found in repository root."
          }

          $env:NEXUS_PASSWORD | docker login $env:NEXUS_REGISTRY `
            --username $env:NEXUS_USERNAME --password-stdin

          if ($LASTEXITCODE -ne 0) {
            throw "Docker login to Nexus failed."
          }

          $image = "$($env:NEXUS_REGISTRY)/task-1-java"
          $tag = $env:GITHUB_SHA

          docker build -t "${image}:${tag}" .
          if ($LASTEXITCODE -ne 0) {
            throw "Docker image build failed."
          }

          docker push "${image}:${tag}"
          if ($LASTEXITCODE -ne 0) {
            throw "Docker image push failed."
          }

          docker tag "${image}:${tag}" "${image}:latest"
          docker push "${image}:latest"
          if ($LASTEXITCODE -ne 0) {
            throw "Docker latest image push failed."
          }

          docker logout $env:NEXUS_REGISTRY
